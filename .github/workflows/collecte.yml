name: Collecte bihebdomadaire — marchés

on:
  schedule:
    - cron: "0 4 * * 1,4"   # lundi et jeudi à 4 h UTC
  workflow_dispatch:         # bouton « Run workflow » pour un lancement manuel

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Collecter BOAMP, TED, DECP et OCCAR
        run: |
          # lundi : du jeudi au lundi (4 jours) ; jeudi : du lundi au jeudi (3 jours)
          if [ "$(date -u +%u)" = "1" ]; then export JOURS=4; else export JOURS=3; fi
          python3 collecte.py

      - name: Enregistrer le résultat dans le dépôt
        if: always()
        run: |
          git config user.name "collecte-automatique"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p donnees
          git add donnees
          git diff --cached --quiet || git commit -m "Collecte du $(date -u +%Y-%m-%d)"
          git push
