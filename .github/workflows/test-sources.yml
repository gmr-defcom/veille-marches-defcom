name: Test des sources (une seule fois)

# Se lance uniquement à la main : onglet Actions > « Test des sources (une seule fois) » > Run workflow.
# N'envoie aucun mail et ne modifie pas la collecte des marchés.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester les sources
        run: python test_sources.py
      - name: Enregistrer le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add donnees/test-sources.md donnees/test-sources.json
          git commit -m "Rapport du test des sources" || echo "Rien à enregistrer"
          git pull --rebase
          git push
